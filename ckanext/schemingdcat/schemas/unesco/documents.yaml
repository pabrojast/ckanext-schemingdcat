### Codes in Schema
# (M): Mandatory
# (R): Recommended
# (C): Conditional
# (O): Optional

#--Dataset (dcat:Dataset) fields--#
dataset_fields:

# Document DOI for auto-fill (O)
# Enter a DOI to automatically fetch and fill metadata from DataCite/CrossRef/Zenodo
- field_name: document_doi
  label:
    en: Document DOI
    es: DOI del documento
    fr: DOI du document
  form_snippet: schemingdcat/form_snippets/doi_autofill.html
  display_snippet: schemingdcat/display_snippets/doi_link.html
  display_property: dct:identifier
  validators: ignore_missing schemingdcat_valid_doi
  form_placeholder:
    en: e.g. 10.5281/zenodo.1234567 or https://doi.org/10.1234/example
    es: ej. 10.5281/zenodo.1234567 o https://doi.org/10.1234/example
    fr: p. ex. 10.5281/zenodo.1234567 ou https://doi.org/10.1234/example
  help_text:
    en: "Enter a DOI to auto-fill document metadata from <a href='https://datacite.org' target='_blank'>DataCite</a>, <a href='https://www.crossref.org' target='_blank'>CrossRef</a>, or <a href='https://zenodo.org' target='_blank'>Zenodo</a>. Click 'Fetch' to retrieve and preview metadata before applying. If you do not have a DOI, leave this empty and continue with manual metadata."
    es: "Ingrese un DOI para auto-rellenar los metadatos del documento desde <a href='https://datacite.org' target='_blank'>DataCite</a>, <a href='https://www.crossref.org' target='_blank'>CrossRef</a>, o <a href='https://zenodo.org' target='_blank'>Zenodo</a>. Haga clic en 'Buscar' para obtener y previsualizar los metadatos antes de aplicarlos. Si no tiene DOI, deje este campo en blanco y continúe con los metadatos manuales."
    fr: "Entrez un DOI pour auto-remplir les métadonnées du document depuis <a href='https://datacite.org' target='_blank'>DataCite</a>, <a href='https://www.crossref.org' target='_blank'>CrossRef</a>, ou <a href='https://zenodo.org' target='_blank'>Zenodo</a>. Cliquez sur 'Rechercher' pour récupérer et prévisualiser les métadonnées avant de les appliquer. Si vous n'avez pas de DOI, laissez ce champ vide et continuez avec les métadonnées manuelles."
  help_allow_html: True
  default_no_doi: true
  no_doi_help_text:
    en: "No DOI? Skip the fetch step and fill the document metadata manually. You can upload a file in the Add data step or paste a link."
    es: "Si no tiene DOI, omita la búsqueda y complete los metadatos manualmente. Puede subir el archivo en el paso de Añadir datos o pegar un enlace."
    fr: "Si vous n'avez pas de DOI, ignorez la recherche et complétez les métadonnées manuellement. Vous pourrez téléverser le fichier à l'étape Ajouter des données ou coller un lien."
  form_group_id: doi_lookup
  field_mapping:
    title: title_translated
    abstract: notes_translated
    publication_year: publication_year
    publisher: publisher_name
    document_type: document_type
    keywords: tag_string
    authors:
      - authors_json

# Dataset title translated (M)
- field_name: title_translated
  label: 
    en: Document title
    es: Título del documento
    fr: Titre du document
  preset: schemingdcat_fluent_title_translated
  required: True
  display_property: dct:title
  form_placeholder:
    en: e.g. A descriptive title.
    es: ej. Un título descriptivo.
    fr: p. ex. Un titre descriptif.
  form_languages: ["en", "es", "fr"]
  required_language: "en"
  form_group_id: title

# # Dataset abstract translated (M)
- field_name: notes_translated
  label: 
    en: Document abstract 
    es: Resumen del documento
    fr: Résumé du document
  preset: schemingdcat_fluent_notes_translated
  required: True
  display_property: dct:description
  form_placeholder:
    en: e.g. Some useful description about the document.
    es: ej. Una descripción útil sobre el documento.
    fr: p. ex. Une description utile du document.
  form_languages: ["en", "es", "fr"]
  required_language: "en"
  default_values: 
    en: Default abstract of the {document}.
    es: Resumen por defecto del documento {document}.
    fr: Résumé par défaut du document {document}.
  form_group_id: notes

# Custom DOI (optional, keeps the fetched DOI URL or lets users enter one manually)
- field_name: custom_doi
  label:
    en: Custom DOI
    es: DOI personalizado
    fr: DOI personnalisé
  display_property: adms:identifier
  form_placeholder: https://doi.org/10.63253/ilrsgq77
  help_text:
    en: "Keeps the document DOI URL. Auto-filled after fetching metadata, but you can edit it."
    es: "Conserva la URL del DOI del documento. Se rellena al obtener metadatos, pero puede editarse."
    fr: "Conserve l'URL du DOI du document. Renseigné après la récupération des métadonnées, mais modifiable."
  form_group_id: identification

# Auto Citation (auto-generated from metadata)
- field_name: citation
  label:
    en: Citation
    es: Citación automática
    fr: Citation automatique
  display_property: dct:bibliographicCitation
  form_placeholder:
    en: Auto-generated from authors, year, title and publisher.
    es: Se genera automáticamente usando autores, año, título y editorial.
    fr: Générée automatiquement à partir des auteurs, année, titre et éditeur.
  help_text:
    en: "Read-only citation built automatically from the other metadata. Edit the custom citation below only if you need to override it."
    es: "Campo de solo lectura generado con los demás metadatos. Usa la citación personalizada solo si necesitas sobrescribirla."
    fr: "Champ en lecture seule généré à partir des autres métadonnées. Utilisez la citation personnalisée uniquement en cas de besoin."
  form_attrs:
    readonly: true
  form_group_id: citation

# Custom Citation (optional override)
- field_name: custom_citation
  label:
    en: Custom citation (optional)
    es: Citación personalizada (opcional)
    fr: Citation personnalisée (optionnelle)
  form_placeholder:
    en: "Lastname, F.; Second, A. (2025). Title. [Document]. Publisher. https://doi.org/..."
    es: "Apellido, N.; Segundo, A. (2025). Título. [Documento]. Editorial. https://doi.org/..."
    fr: "Nom, P.; Second, A. (2025). Titre. [Document]. Éditeur. https://doi.org/..."
  help_text:
    en: "Leave blank to use the automatic citation. Fill only if you need to override the generated citation."
    es: "Deja vacío para usar la citación automática. Completa solo si necesitas sobrescribir la generada."
    fr: "Laissez vide pour utiliser la citation automatique. Renseignez uniquement si vous devez la remplacer."
  form_group_id: citation


